# Drafts branch: build the preview, deploy it to Vercel, and validate publish PRs.
#
#  - push to `drafts`        → build (main + drafts, symlinked) → stable Vercel URL
#  - pull request (any)      → build → per-PR preview URL, commented on the PR
#  - PR targeting `main`     → additionally must only touch _posts/*.md and
#                              assets/images/drafts/** (that's how publishing works)
#
# One-time setup: add a VERCEL_TOKEN repository secret (any token of a user
# with deploy rights on the team below). The project is created automatically
# on the first deployment if it does not exist yet.

name: Drafts

on:
  push:
    branches: [drafts]
  pull_request:
    branches: [main, drafts]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: drafts-${{ github.ref }}
  cancel-in-progress: true

env:
  # Must match `timezone:` in main's _config.yaml so Jekyll's date handling
  # agrees with the production build.
  TZ: Europe/Rome
  VERCEL_ORG_ID: team_DSpZWl5ntUPjXglnI7Dg7S5u
  VERCEL_PROJECT_NAME: italai-drafts

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Install libvips (for draft photo → WebP conversion)
        run: sudo apt-get update && sudo apt-get install -y libvips-dev

      - name: Build preview
        run: |
          if [ -f scripts/build-preview.sh ]; then
            # drafts branch / feature branches: materialize main + link it in.
            bash scripts/build-preview.sh
          else
            # Publish PR against main: the merge ref already contains the full
            # main tree plus the new post — build it as-is.
            bundle exec jekyll build
          fi

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: drafts-preview
          path: _site/
          retention-days: 3

  # Publishing is per-post: a PR to main may only add/modify post files and
  # draft images. Anything else (styling, plumbing, other drafts) is rejected.
  validate-publish-pr:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check PR only touches posts and draft images
        run: |
          CHANGED="$(git diff --name-only origin/main...HEAD)"
          echo "Changed files:"; echo "${CHANGED:-<none>}"
          [ -n "$CHANGED" ] || { echo "Nothing changed"; exit 0; }
          if echo "$CHANGED" | grep -qvE '^(_posts/[^/]+\.md|assets/images/drafts/.+)$'; then
            echo "::error::Publish PRs must only add or modify files under _posts/ and assets/images/drafts/ — this one touches other paths."
            exit 1
          fi
          echo "OK: publish-shaped PR"

  # Stable URL for the drafts branch (production deployment of the project).
  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/drafts'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: drafts-preview
          path: _site

      - name: Deploy to Vercel (stable URL)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: bash .github/scripts/vercel-deploy.sh --prod

  # Per-PR preview URLs, commented back onto the PR.
  deploy-preview:
    needs: build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: drafts-preview
          path: _site

      - name: Deploy preview to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: bash .github/scripts/vercel-deploy.sh > deployment.log

      - name: Comment preview URL on the PR
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          URL="$(grep -oE 'https://[a-z0-9-]+\.vercel\.app' deployment.log | tail -1 || true)"
          if [ -n "$URL" ]; then
            gh pr comment "${{ github.event.pull_request.number }}" \
              --body "👀 Preview for this PR: ${URL}" || echo "::warning::could not comment"
          else
            echo "::warning::no preview URL found in deployment log"; cat deployment.log
          fi
