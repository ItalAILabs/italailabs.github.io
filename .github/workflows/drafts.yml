# Drafts review — validation for publish PRs only. Nothing runs on plain
# commits to the drafts branch, and nothing is deployed anywhere.
#
#  - PR -> main : a cherry-picked post's commits must only touch _posts/*.md
#                 and assets/{images,videos,files}/drafts/**, and the merged
#                 tree must build. Merging is publishing.
#  - workflow_dispatch : on-demand "does this branch build" check (manual).

name: Drafts review

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: drafts-review-${{ github.ref }}
  cancel-in-progress: true

env:
  # Must match `timezone:` in main's _config.yaml so Jekyll's date handling
  # agrees with the production build.
  TZ: Europe/Rome

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Install libvips (draft photos → WebP)
        run: sudo apt-get update && sudo apt-get install -y libvips-dev

      - name: Build assembled site
        run: |
          if [ -f scripts/build-preview.sh ]; then
            # Dispatched on the drafts branch: materialize main + link it in.
            bash scripts/build-preview.sh
          else
            # Publish PR against main: the merge ref is already the full main
            # tree plus the cherry-picked post — build it as-is.
            bundle exec jekyll build
          fi

  validate-publish-pr:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check PR only touches posts and draft media
        run: |
          CHANGED="$(git diff --name-only origin/main...HEAD)"
          echo "Changed files:"; echo "${CHANGED:-<none>}"
          [ -n "$CHANGED" ] || { echo "Nothing changed"; exit 0; }
          if echo "$CHANGED" | grep -qvE '^(_posts/[^/]+\.md|assets/(images|videos|files)/drafts/.+)$'; then
            echo "::error::Publish PRs must only add or modify files under _posts/ and assets/{images,videos,files}/drafts/ — this one touches other paths."
            exit 1
          fi
          echo "OK: publish-shaped PR"
