# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# Builds the Jekyll site (with generated WebP overlay) and deploys it to
# Cloudflare Pages via wrangler. Cloudflare serves the built files as-is;
# nothing is built on Cloudflare's side.
name: Deploy Jekyll site

on:
  # Runs on pushes targeting the default branch that touch site content.
  # Doc/script-only pushes can't change the built site, so they're skipped;
  # use "Run workflow" (workflow_dispatch) to deploy manually when needed.
  push:
    branches: ["main"]
    paths-ignore:
      - "README.md"
      - "SECURITY.md"
      - "scripts/**"
      - ".github/**"
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  # write is required for the generated-assets WebP push step
  contents: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    env:
      # Must match `timezone:` in _config.yaml so Jekyll's "future" cutoff
      # and date rendering use the same boundary as the site.
      TZ: Europe/Rome
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout generated-assets branch
        id: checkout-generated
        uses: actions/checkout@v4
        with:
          ref: generated-assets
          path: generated-assets
          token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Hash source images and build manifest
        id: manifest
        run: |
          > changed_images.manifest

          while IFS= read -r -d '' src; do
            rel="${src#./}"
            current_hash=$(sha256sum "$src" | cut -d' ' -f1)
            stored=$(grep "  $rel$" generated-assets/manifest.sha256 2>/dev/null | cut -d' ' -f1)
            if [ -z "$stored" ] || [ "$current_hash" != "$stored" ]; then
              echo "Changed or missing: $rel"
              echo "$rel" >> changed_images.manifest
            fi
          done < <(find assets/images \( -iname "*.jpg" -o -iname "*.jpeg" -o -iname "*.png" \) -print0 2>/dev/null)

          COUNT=$(wc -l < changed_images.manifest | tr -d ' ')
          echo "changed_count=$COUNT" >> $GITHUB_OUTPUT

          if [ "$COUNT" -gt "0" ]; then
            echo "any_changed=true" >> $GITHUB_OUTPUT
            echo "$COUNT image(s) need regeneration"
          else
            echo "any_changed=false" >> $GITHUB_OUTPUT
            echo "All images are up to date"
          fi

      - name: Print manifest
        run: |
          echo "any_changed: ${{ steps.manifest.outputs.any_changed }}"
          echo "changed_count: ${{ steps.manifest.outputs.changed_count }}"
          echo "---"
          cat changed_images.manifest

      - name: Setup Ruby
        uses: ruby/setup-ruby@4a9ddd6f338a97768b8006bf671dfbad383215f4
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Install libvips
        if: steps.manifest.outputs.any_changed == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libvips-dev

      - name: Generate WebP images
        if: steps.manifest.outputs.any_changed == 'true'
        run: bundle exec ruby _plugins/vips-webp-generator.rb
        env:
          WEBP_MANIFEST: ${{ github.workspace }}/changed_images.manifest

      - name: Commit and push to generated-assets branch
        if: steps.manifest.outputs.any_changed == 'true'
        continue-on-error: true
        run: |
          if [ "${{ steps.checkout-generated.outcome }}" == "success" ]; then
            echo "generated-assets branch found — using existing checkout"
            cd generated-assets
          else
            echo "generated-assets branch not found — initialising orphan branch"
            cd generated-assets
            git checkout --orphan generated-assets
            git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Copy generated WebPs from the jekyll build
          find ../assets/images -name "*.webp" | while IFS= read -r f; do
            rel="${f#../}"
            mkdir -p "$(dirname "$rel")"
            cp "$f" "$rel"
          done

          # Rebuild manifest.sha256 from current source images
          > manifest.sha256
          find ../assets/images \( -iname "*.jpg" -o -iname "*.jpeg" -o -iname "*.png" \) | while IFS= read -r f; do
            rel="${f#../}"
            echo "$(sha256sum "$f" | cut -d' ' -f1)  $rel" >> manifest.sha256
          done

          git add .
          git diff --staged --quiet && echo "Nothing to commit" && exit 0
          git commit -m "chore: regenerate WebP images (${{ steps.manifest.outputs.changed_count }} changed)"
          git push origin HEAD:generated-assets

          echo "---"
          echo "Push succeeded"
          echo "Commit: $(git rev-parse HEAD)"

      - name: Overlay generated WebP images from generated-assets branch
        run: |
          rsync -a --ignore-missing-args --include='*.webp' --include='*/' --exclude='*' generated-assets/assets/images/ assets/images/
          if [ -f generated-assets/manifest.sha256 ]; then
            cp generated-assets/manifest.sha256 assets/images/manifest.sha256
          fi

      - name: Build with Jekyll
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site/

  # Deployment job
  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download built site
        uses: actions/download-artifact@v4
        with:
          name: site
          path: _site

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy _site --project-name=italai --branch=main