# Drafts checks — validation only. Nothing here is deployed or published.
#
#  - push to `drafts`    → assemble the site (main + drafts, symlinked) and build
#                          it, so a broken post is caught before anyone publishes.
#  - PR targeting main   → must only touch _posts/*.md and assets/images/drafts/**,
#                          and the merged tree must build. Merging is publishing.

name: Drafts

on:
  push:
    branches: [drafts]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: drafts-${{ github.ref }}
  cancel-in-progress: true

env:
  # Must match `timezone:` in main's _config.yaml so Jekyll's date handling
  # agrees with the production build.
  TZ: Europe/Rome

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Install libvips (draft photos → WebP)
        run: sudo apt-get update && sudo apt-get install -y libvips-dev

      - name: Build
        run: |
          if [ -f scripts/build-preview.sh ]; then
            # drafts branch / feature branches: materialize main + link it in.
            bash scripts/build-preview.sh
          else
            # Publish PR against main: the merge ref already contains the full
            # main tree plus the new post — build it as-is.
            bundle exec jekyll build
          fi

  # Publishing is per-post: a PR to main may only add/modify post files and
  # draft images. Anything else (styling, plumbing, other drafts) is rejected.
  validate-publish-pr:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check PR only touches posts and draft images
        run: |
          CHANGED="$(git diff --name-only origin/main...HEAD)"
          echo "Changed files:"; echo "${CHANGED:-<none>}"
          [ -n "$CHANGED" ] || { echo "Nothing changed"; exit 0; }
          if echo "$CHANGED" | grep -qvE '^(_posts/[^/]+\.md|assets/images/drafts/.+)$'; then
            echo "::error::Publish PRs must only add or modify files under _posts/ and assets/images/drafts/ — this one touches other paths."
            exit 1
          fi
          echo "OK: publish-shaped PR"
