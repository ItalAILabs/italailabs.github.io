source: ./

url: "https://italailabs.landofsharks.com"

title: "ItalAI Labs"
tagline: "Artificial Intelligence Research and Development"
description: "ItalAI is a Sapienza University of Rome spinout building Physical AI systems for industrial environments, with a research record published at CVPR, ICLR, ECCV, IROS and AAAI."
author:
  name: "ItalAI"
  type: Organization
  twitter: _italai
logo: "/assets/logo.png"
loading_debug: true

legal_name: "ItalAI S.R.L."
address: Corso Vittorio Emanuele II 287, 00186 Roma RM
iva: 17384921007
email: research@italailabs.com

# Do not publish legacy raster assets; only WebP should ship in the build artifacts.
exclude:
  # - "assets/images/**/*.jpg"
  # - "assets/images/**/*.jpeg"
  # - "assets/images/**/*.png"
  # - "assets/images/**/*.gif"
  - "scripts"
  - "README.md"

social:
  twitter: https://x.com/_italai
  linkedin: https://www.linkedin.com/company/italai/
  github: https://github.com/ItalAILabs

twitter:
  username: _italai
  card: summary_large_image

locale: en_US

webmaster_verifications:
  google: trjGoWqK4ZnLygnmefGpW0b2ev8If5_3QDtXC_rm83w

ga_measurement_id: G-70VK7F6E5Q

markdown: kramdown
kramdown:
  toc_levels: 2..5
  math_engine: null
  math_output: latex
sass:
  style: compressed
  
safe: false
plugins:
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-minifier

jekyll-minifier:
  exclude: ['robots.txt']
  compress_css: false
  compress_javascript: true
  compress_json: false 

blogs_manifest:
  per_page: 12
  output_dir: assets/data/blog
  per_category: true
  ndjson: true

collections:
  projects:
    output: true
    permalink: /projects/:path/

projects_manifest:
  per_page: 12
  output_dir: assets/data/projects
  ndjson: true