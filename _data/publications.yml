# Publication record for the /research page, filterable by venue in the UI.
# domain groups render in this file's encounter order (Robotics & Manipulation,
# Embodied AI, Computer Vision, Multimodal & Foundation Models).
- name: "LEGO"
  venue: "ICLR'26"
  url: "https://arxiv.org/abs/2510.12866"
  domain: "Robotics & Manipulation"
  title: "Learning to grasp anything by playing with random toys."
  contribution: "Training a grasping policy on randomly assembled shape primitives generalises to unseen real objects, with no in-domain data collection."

- name: "HYP2NAV"
  venue: "IROS'24"
  url: "https://arxiv.org/abs/2410.06912"
  domain: "Embodied AI"
  title: "Hyperbolic planning and curiosity for crowd navigation."
  contribution: "Planning in hyperbolic space gives an agent a better structural prior for navigating dense human crowds."

- name: "SDA"
  venue: "ICLR'24"
  url: "https://arxiv.org/abs/2404.11327"
  domain: "Embodied AI"
  title: "Following the human thread in social navigation."
  contribution: "Tracking human intent as a continuous signal, rather than as obstacles, produces socially legible robot motion."

- name: "PREGO"
  venue: "CVPR'24"
  url: "https://arxiv.org/abs/2404.01933"
  domain: "Computer Vision"
  title: "Online mistake detection in procedural egocentric videos."
  contribution: "Detects a procedural error as it happens from a first-person view — the perception half of any assistive or inspection system."

- name: "HALO"
  venue: "ICML'24"
  url: "https://arxiv.org/abs/2306.11180"
  domain: "Computer Vision"
  title: "Hyperbolic active learning for semantic segmentation under domain shift."
  contribution: "Chooses which pixels are worth labelling when the deployment domain differs from the training one — directly a data-cost problem."

- name: "LCR"
  venue: "AAAI'26"
  url: "https://arxiv.org/abs/2503.18674"
  domain: "Computer Vision"
  title: "Human motion unlearning."
  contribution: "Removes specific learned motions from a generative model without retraining it from scratch."

- name: "VIDEO UNLEARNING"
  venue: "ICLR'26"
  url: "https://arxiv.org/abs/2506.07891"
  domain: "Computer Vision"
  title: "Unlearning in video models via a low-rank refusal vector."
  contribution: "A low-rank edit suppresses unwanted generations, giving a practical control surface for deployed video models."

- name: "HYCOCLIP"
  venue: "ICLR'25"
  url: "https://arxiv.org/abs/2410.06912"
  domain: "Multimodal & Foundation Models"
  title: "Compositional entailment learning for hyperbolic vision-language models."
  contribution: "Learns part-whole structure between images and text, so the model composes concepts instead of memorising pairs."

- name: "HYPERBOLIC MULTIMODAL"
  venue: "ECCV'24"
  url: "https://arxiv.org/abs/2408.05097"
  domain: "Multimodal & Foundation Models"
  title: "Hyperbolic learning with multimodal large language models."
  contribution: "Shows hyperbolic representations scale to multimodal LLMs, improving how hierarchy is encoded across modalities."

- name: "SERPENT"
  venue: "ICML'24"
  url: "https://arxiv.org/abs/2306.11180"
  domain: "Multimodal & Foundation Models"
  title: "Selective resampling for expressive state space models."
  contribution: "Makes state space models more expressive at long range while keeping their linear-time advantage over attention."

- name: "LONGCODEBENCH"
  venue: "COLM'25"
  url: "https://arxiv.org/abs/2306.11180"
  domain: "Multimodal & Foundation Models"
  title: "Evaluating coding LLMs at one-million-token context windows."
  contribution: "A benchmark showing where long-context claims break down in practice on real codebases."
