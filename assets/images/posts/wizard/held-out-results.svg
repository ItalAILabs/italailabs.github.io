<svg viewBox="47.5 36 1141.5 554.5" width="1141.5" height="554.5" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/2000/svg" role="img" aria-labelledby="w5-t w5-d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="w5-t">Held-out results: biggest gains where source tasks cover the shift</title>
<desc id="w5-d">Held-out results, points over the best competing method (one-demo fine-tuning or LoRA-Gen): LIBERO-Spatial plus 12 (40 versus 28), LIBERO-Goal plus 5 (22 versus 17), LIBERO-Object plus 2 (3 versus 1, unseen object categories), LIBERO-10 part A plus 6 (9 versus 3), LIBERO-10 part B plus 4 (7 versus 3), MetaWorld ML45 plus 6 (66 versus 60), Franka five-task average plus 20 (37 versus 17). Pretrained pi0.5 reaches 0 percent on all held-out LIBERO suites; nearest-neighbour retrieval at most 2 percent. WIZARD leads the evaluated baselines across all held-out settings; gaps are largest where source tasks cover the shift and smallest where they do not. Exact per-method values are in the tables below the figure.</desc>

<defs>
  <linearGradient id="w5-bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#2b1a44"/><stop offset="1" stop-color="rgba(12,7,23,0.05)"/>
  </linearGradient>
  <linearGradient id="w5-bar" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#6A7CFF"/><stop offset="1" stop-color="#9b9cf7"/>
  </linearGradient>
</defs>
<rect x="47.5" y="36" width="1141.5" height="554.5" fill="#f4f1e6" style="fill:var(--standard-light,#f4f1e6)"/>
<text x="48" y="58" text-anchor="start" font-family="'DM Sans','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="600" fill="#0c0717">Held-out results: biggest gains where source tasks cover the shift</text>
<rect x="48" y="84" width="1104" height="506" rx="14" fill="rgba(12,7,23,0.04)" stroke="rgba(12,7,23,0.18)" stroke-width="1" />
<text x="76" y="118" text-anchor="start" font-family="'DM Sans','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="600" fill="#0c0717">Gap over the best competing method</text>
<text x="76" y="141" text-anchor="start" font-family="'DM Sans','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="14.5" font-weight="400" fill="#8a8676">Points ahead of the best of 1-demo fine-tuning or LoRA-Gen. Average success, held-out tasks.</text>
<text x="76" y="160" text-anchor="start" font-family="'DM Sans','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#a89f85">Pretrained π0.5: 0% on all held-out LIBERO suites · NN retrieval: ≤2% · LoRA-Gen not evaluated on LIBERO-10 parts or Franka</text>

